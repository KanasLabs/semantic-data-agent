name: Secret scan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "${release_url}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${checksums}" \
            "${release_url}/${checksums}"
          grep "  ${archive}$" "${RUNNER_TEMP}/${checksums}" \
            | sed "s#  ${archive}$#  ${RUNNER_TEMP}/${archive}#" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full Git history
        shell: bash
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --config .gitleaks.toml
          --redact
          --verbose
          .
