name: Secret scan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "${release_url}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${checksums}" \
            "${release_url}/${checksums}"
          expected_sha256="$(
            awk -v file="${archive}" '$2 == file { print $1 }' \
              "${RUNNER_TEMP}/${checksums}"
          )"
          test -n "${expected_sha256}"
          actual_sha256="$(
            sha256sum "${RUNNER_TEMP}/${archive}" | awk '{ print $1 }'
          )"
          test "${actual_sha256}" = "${expected_sha256}"
          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full Git history
        shell: bash
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --config .gitleaks.toml
          --redact
          --verbose
          .
